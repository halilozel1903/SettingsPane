  <rect x="990" y="296" width="216" height="64" rx="9" fill="#ffffff"/>
  <rect x="1002" y="310" width="70" height="8" rx="4" fill="#475569" fill-opacity="0.7"/>
  <rect x="1172" y="306" width="24" height="15" rx="7.5" fill="#22c55e"/>
  <circle cx="1188" cy="313.5" r="6" fill="#ffffff"/>
  <line x1="1002" y1="328" x2="1196" y2="328" stroke="#000000" stroke-opacity="0.08"/>
  <rect x="1002" y="339" width="84" height="8" rx="4" fill="#475569" fill-opacity="0.7"/>
  <rect x="1150" y="337" width="46" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="990" y="372" width="216" height="64" rx="9" fill="#ffffff"/>
  <rect x="1002" y="386" width="60" height="8" rx="4" fill="#475569" fill-opacity="0.7"/>
  <rect x="1172" y="382" width="24" height="15" rx="7.5" fill="#cbd5e1"/>
  <circle cx="1180" cy="389.5" r="6" fill="#ffffff"/>
  <line x1="1002" y1="404" x2="1196" y2="404" stroke="#000000" stroke-opacity="0.08"/>
  <rect x="1002" y="415" width="96" height="8" rx="4" fill="#475569" fill-opacity="0.7"/>

  </g>
</svg>
