<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="SettingsPane: native macOS Settings windows in SwiftUI, with toolbar and sidebar styles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1433"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#ececf0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="930" cy="280" r="320" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="222" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-1.5">SettingsPane</text>
    <text x="74" y="274" fill="#cbd5e1" font-size="26" font-weight="500">Native macOS Settings windows in SwiftUI</text>
    <text x="74" y="310" fill="#94a3b8" font-size="19">Toolbar or sidebar · AppStorage keys · reset · deep links</text>
    <g font-size="19" font-weight="600">
      <rect x="74" y="342" width="116" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="132" y="367" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>
      <rect x="202" y="342" width="140" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="272" y="367" fill="#e2e8f0" text-anchor="middle">macOS 14+</text>
      <rect x="354" y="342" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="408" y="367" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="474" y="342" width="62" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="505" y="367" fill="#e2e8f0" text-anchor="middle">⌘,</text>
    </g>
  </g>

  <g transform="translate(14,0)">
  <!-- Toolbar style window -->
  <g filter="url(#shadow)">
    <rect x="640" y="64" width="400" height="330" rx="14" fill="url(#window)" stroke="#000000" stroke-opacity="0.2"/>
  </g>
  <circle cx="660" cy="84" r="6" fill="#ff5f57"/>
  <circle cx="680" cy="84" r="6" fill="#febc2e"/>
  <circle cx="700" cy="84" r="6" fill="#28c840"/>
  <text x="840" y="89" fill="#334155" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">General</text>
  <!-- toolbar items -->
  <rect x="690" y="102" width="60" height="50" rx="8" fill="#000000" fill-opacity="0.07"/>
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="720" cy="121" r="8" stroke="#3b82f6"/>
    <circle cx="720" cy="121" r="3" stroke="#3b82f6"/>
    <path d="M770 113 l12 0 m-12 8 l12 0 m-12 8 l8 0" stroke="#64748b"/>
    <path d="M832 114 a5 5 0 1 1 5 5 l0 6 a5 5 0 1 1 -5 -5 l6 0" stroke="#64748b"/>
    <circle cx="896" cy="117" r="4" stroke="#64748b"/>
    <path d="M888 129 a8 6 0 0 1 16 0" stroke="#64748b"/>
    <circle cx="954" cy="118" r="4" stroke="#64748b"/>
    <circle cx="962" cy="126" r="4" stroke="#64748b"/>
  </g>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="720" y="145" fill="#3b82f6">General</text>
    <text x="776" y="145" fill="#64748b">Appearance</text>
    <text x="837" y="145" fill="#64748b">Shortcuts</text>
    <text x="896" y="145" fill="#64748b">Accounts</text>
    <text x="958" y="145" fill="#64748b">Advanced</text>
  </g>
  <line x1="640" y1="162" x2="1040" y2="162" stroke="#000000" stroke-opacity="0.12"/>
  <!-- classic form: right-aligned labels -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="end">
    <text x="760" y="194">Startup:</text>
    <text x="760" y="248">Notch style:</text>
    <text x="760" y="320">Open on hover:</text>
  </g>
  <g>
    <rect x="772" y="183" width="13" height="13" rx="3" fill="#3b82f6"/>
    <path d="M775 189.5 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="794" y="185" width="150" height="8" rx="4" fill="#334155" fill-opacity="0.55"/>
    <rect x="772" y="207" width="13" height="13" rx="3" fill="#3b82f6"/>
    <path d="M775 213.5 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="794" y="209" width="170" height="8" rx="4" fill="#334155" fill-opacity="0.55"/>
    <circle cx="778.5" cy="244" r="6.5" fill="#3b82f6"/>
    <circle cx="778.5" cy="244" r="2.5" fill="#ffffff"/>
    <rect x="794" y="240" width="160" height="8" rx="4" fill="#334155" fill-opacity="0.55"/>
    <circle cx="778.5" cy="268" r="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="794" y="264" width="140" height="8" rx="4" fill="#334155" fill-opacity="0.4"/>
    <circle cx="778.5" cy="292" r="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="794" y="288" width="176" height="8" rx="4" fill="#334155" fill-opacity="0.4"/>
    <rect x="772" y="314" width="150" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="772" y="314" width="46" height="4" rx="2" fill="url(#accent)"/>
    <circle cx="818" cy="316" r="7" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="934" y="311" width="30" height="9" rx="4" fill="#64748b" fill-opacity="0.5"/>
  </g>
  <line x1="680" y1="342" x2="1000" y2="342" stroke="#000000" stroke-opacity="0.1"/>
  <rect x="772" y="356" width="120" height="22" rx="6" fill="#ffffff" stroke="#000000" stroke-opacity="0.15"/>
  <text x="832" y="371" fill="#1e293b" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Restore Defaults</text>

  </g>

  <!-- The toolbar window fits each pane's height -->
  <g stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M636 74 L636 384"/>
    <path d="M628 84 l8 -10 l8 10"/>
    <path d="M628 374 l8 10 l8 -10"/>
  </g>
  <text x="654" y="48" fill="#a78bfa" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">the window fits each pane</text>

  <g transform="translate(50,14)">
  <!-- Sidebar style window, in front -->
  <g filter="url(#shadow)">
    <rect x="860" y="250" width="360" height="260" rx="14" fill="url(#window)" stroke="#000000" stroke-opacity="0.2"/>
  </g>
  <rect x="868" y="258" width="108" height="244" rx="9" fill="#e2e2e8"/>
  <circle cx="884" cy="274" r="5" fill="#ff5f57"/>
  <circle cx="900" cy="274" r="5" fill="#febc2e"/>
  <circle cx="916" cy="274" r="5" fill="#28c840"/>
  <rect x="874" y="296" width="96" height="22" rx="6" fill="#3b82f6" fill-opacity="0.9"/>
  <rect x="880" y="300" width="14" height="14" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="900" y="303" width="50" height="8" rx="4" fill="#ffffff"/>
  <g>
    <rect x="880" y="330" width="14" height="14" rx="4" fill="#f97316"/>
    <rect x="900" y="333" width="44" height="8" rx="4" fill="#64748b" fill-opacity="0.6"/>
    <rect x="880" y="356" width="14" height="14" rx="4" fill="#6366f1"/>
    <rect x="900" y="359" width="56" height="8" rx="4" fill="#64748b" fill-opacity="0.6"/>
    <rect x="880" y="382" width="14" height="14" rx="4" fill="#8e8e93"/>
    <rect x="900" y="385" width="40" height="8" rx="4" fill="#64748b" fill-opacity="0.6"/>
